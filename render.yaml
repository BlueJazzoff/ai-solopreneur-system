services:
  - type: web
    name: ai-solopreneur-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: WHOP_MEMBER_URL
        sync: false
      - key: WHOP_AI_URL
        sync: false
